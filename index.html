<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero Visit — Kunjungan Online</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">
    <main class="app">
      <div class="phone">

        <section class="hero">
          <div class="hero-top">
            <div class="logo">Zero Visit</div>
            <div class="hero-badge">ONLINE</div>
          </div>

          <h1>Layanan Kunjungan Online</h1>
          <p>
            Isi data kunjungan dengan lengkap untuk mendapatkan tiket kunjungan dan QR verifikasi.
          </p>
        </section>

        <section class="content">
          <div class="form-card">

            <div class="field">
              <label for="nik">NIK</label>
              <input
                id="nik"
                type="text"
                inputmode="numeric"
                maxlength="16"
                placeholder="Masukkan 16 digit NIK"
              />
            </div>

            <div class="field">
              <label for="nama">Nama Pengunjung</label>
              <input
                id="nama"
                type="text"
                placeholder="Masukkan nama lengkap"
              />
            </div>

            <div class="field">
              <label for="gender">Jenis Kelamin</label>
              <select id="gender">
                <option value="">Pilih jenis kelamin</option>
                <option value="Laki-Laki">Laki-Laki</option>
                <option value="Perempuan">Perempuan</option>
              </select>
            </div>

            <div class="field">
              <label for="relasi">Hubungan dengan WBP</label>
              <select id="relasi">
                <option value="">Pilih hubungan</option>
                <option value="Ayah">Ayah</option>
                <option value="Ibu">Ibu</option>
                <option value="Adik">Adik</option>
                <option value="Kakak">Kakak</option>
                <option value="Saudara Jauh">Saudara Jauh</option>
                <option value="Suami/Istri">Suami/Istri</option>
                <option value="Anak">Anak</option>
                <option value="Teman">Teman</option>
              </select>
            </div>

            <div class="pengikut">
              <div class="pengikut-title">Jumlah Pengikut</div>

              <div class="pengikut-row">
                <span>Laki-Laki</span>
                <input id="ikut_l" type="number" min="0" value="0" />
              </div>

              <div class="pengikut-row">
                <span>Perempuan</span>
                <input id="ikut_p" type="number" min="0" value="0" />
              </div>

              <div class="pengikut-row">
                <span>Anak-Anak</span>
                <input id="ikut_a" type="number" min="0" value="0" />
              </div>
            </div>

            <div class="field">
              <label for="wbp">Nama WBP</label>
              <input
                id="wbp"
                list="wbp-list"
                placeholder="Cari nama WBP"
                autocomplete="off"
              />
              <datalist id="wbp-list"></datalist>
            </div>

            <button
              id="btn-daftar"
              class="btn"
              type="button"
              onclick="booking()"
              disabled
            >
              Daftarkan
            </button>

          </div>
        </section>

      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <!-- daftarWBP kamu taruh di file ini -->
  <script src="wbp-data.js"></script>

  <script src="app.js"></script>
</body>
</html>
